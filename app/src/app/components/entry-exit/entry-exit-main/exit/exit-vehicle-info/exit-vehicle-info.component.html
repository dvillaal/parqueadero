<div *ngIf="selectedVehicle() as vehicle" class="bg-gray-50 dark:bg-gray-800/30 rounded-2xl p-8 border border-dashed border-gray-200 dark:border-gray-700 flex flex-col gap-6">
  <div class="flex justify-between items-center">
    <app-exit-vehicle-info-plate [plate]="vehicle.vehiculo.placa"/>
    <div class="text-right">
      <app-exit-vehicle-info-time [elapsedTime]="elapsedTime()" />
    </div>
  </div>
  <div class="h-px bg-gray-200 dark:bg-gray-700 w-full"></div>
  <app-exit-vehicle-info-payment-amount [paymentAmount]="paymentAmount()"/>
  <div class="flex flex-col gap-3 pt-4">
    <button (click)="onSubmit(vehicle.vehiculo.placa)" class="w-full bg-primary hover:bg-primary/90 text-white font-black text-xl h-20 rounded-xl flex flex-col items-center justify-center transition-all shadow-xl shadow-primary/30">
      <span>Confirm Payment</span>
    </button>
  </div>
</div>
