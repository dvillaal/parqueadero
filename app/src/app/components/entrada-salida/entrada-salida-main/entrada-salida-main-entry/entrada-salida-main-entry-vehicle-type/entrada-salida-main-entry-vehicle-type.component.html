<div class="flex flex-col gap-2">
  <label class="text-gray-900 dark:text-gray-100 text-base font-semibold">Vehicle Type</label>
  <div class="grid grid-cols-3 gap-3">
    @for (item of buttonOptions; track $index) {
      <app-entrada-salida-main-entry-vehicle-type-button
        [icon]="item.icon"
        [label]="item.label"
        [tipoVehiculo]="item.tipoVehiculo"
        class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-gray-100 dark:border-gray-800 text-gray-500 hover:border-primary/50 transition-all"
      />
    }
  </div>
</div>
